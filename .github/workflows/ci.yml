name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyyaml aiosqlite pytest pytest-asyncio httpx
      - name: Tests
        working-directory: .
        run: PYTHONPATH=backend:tests:. pytest tests/ -q
